openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leads
    description: Lead discovery operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /discover:
    post:
      operationId: discoverLeads
      tags: [leads]
      summary: Discover and score local business leads
      description: Searches Google Maps through Apify, enriches business websites, and returns ranked outreach prospects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverLeadsInput"
      responses:
        "200":
          description: Ranked lead results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDiscoveryResult"
        "400":
          description: Invalid search parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Search service error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DiscoverLeadsInput:
      type: object
      properties:
        location:
          type: string
          minLength: 1
          maxLength: 200
          default: United Arab Emirates
        sectorCount:
          type: integer
          minimum: 1
          maximum: 32
          default: 12
        maxPerSector:
          type: integer
          minimum: 1
          maximum: 30
          default: 8
        topN:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        source:
          type: string
          enum: [maps, instagram, both]
          default: maps
    Lead:
      type: object
      properties:
        platform:
          type: string
          enum: [maps, instagram]
        name:
          type: string
        website:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        rating:
          type: ["number", "null"]
        reviewsCount:
          type: ["integer", "null"]
        followersCount:
          type: ["integer", "null"]
        profileUrl:
          type: ["string", "null"]
        score:
          type: integer
        notes:
          type: array
          items:
            type: string
      required:
        - platform
        - name
        - website
        - email
        - phone
        - category
        - address
        - rating
        - reviewsCount
        - followersCount
        - profileUrl
        - score
        - notes
    LeadDiscoveryResult:
      type: object
      properties:
        source:
          type: string
          enum: [maps, instagram, both]
        scannedSectors:
          type: array
          items:
            type: string
        totalFound:
          type: integer
        returned:
          type: integer
        leads:
          type: array
          items:
            $ref: "#/components/schemas/Lead"
      required:
        - source
        - scannedSectors
        - totalFound
        - returned
        - leads
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        detail:
          type: ["string", "null"]
      required:
        - error

